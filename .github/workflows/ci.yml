name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: Build & test (API, tests, MVC)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore RaceDay.sln

      - name: Build solution
        run: dotnet build RaceDay.sln --configuration Release --no-restore

      - name: Build MVC project (Part 3)
        run: dotnet build src/RaceDay.Web/RaceDay.Web.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test RaceDay.sln --configuration Release --no-build --verbosity normal

  docker:
    name: Docker image (MVC)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --tag raceday-web:ci .

      - name: Smoke test the container
        run: |
          docker run --detach --name raceday-web --publish 8080:8080 raceday-web:ci
          for i in $(seq 1 20); do
            if curl --silent --fail http://localhost:8080/health; then echo " container is healthy"; exit 0; fi
            sleep 2
          done
          echo "Container did not become healthy"; docker logs raceday-web; exit 1
